---
clocks:
  - name: "Washington DC"
    timezone: America/New_York
  - name: "San Francisco"
    timezone: America/Los_Angeles
  - name: "EPOCH"
    timezone: EPOCH
---

<!doctype html>
<html lang="en">

<head>
  <title>Situation Clock</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <link rel="stylesheet" type="text/css"
    href="{{ "assets/style.css" | append: "?v=" | append: site.github.build_revision | relative_url }}">
  <script defer src="{{ "assets/script.js" | append: "?v=" | append: site.github.build_revision | relative_url }}"></script>
</head>

<body>
  <div class="status hidden"></div>
  <div class="clocks">
    {% for clock in clocks %}
    <div class="clock {{ clock.name | downcase | replace: " ", "-" }} hidden" data-timezone="{{ clock.timezone }}">
      <div class="time"></div>
      <div class="location">{{ clock.name }}</div>
    </div>
    {% endfor %}
  </div>
</body>

</html>
